<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ORBYL Admin</title>
  <link rel="stylesheet" href="/style/style.css?v=admin">
</head>
<body class="admin-page">
  <main class="admin-shell">
    <div class="admin-card">
      <p class="admin-kicker">ORBYL ADMIN</p>
      <h1>Sign in</h1>
      {% if error %}<p class="admin-error">{{ error }}</p>{% endif %}
      <form method="post" action="/admin/login">
        <label>Email / username<input name="username" autocomplete="username" required></label>
        <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
        <button type="submit">Continue</button>
      </form>
    </div>
  </main>
</body>
</html>
